<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Braindex | The daily trivia game</title>
  <meta name="description" content="A new trivia round every day. Everyone gets the same questions, one attempt, then the leaderboard. Free on iOS, Android and the web." />

  <link rel="icon" type="image/png" href="brain-character.png" />
  <link rel="apple-touch-icon" href="brain-character.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Braindex | The daily trivia game" />
  <meta property="og:description" content="Everyone gets the same questions each day. One attempt, then the leaderboard." />
  <meta property="og:image" content="https://braindexapp.com/braindex_logo_hero.png" />
  <meta property="og:url" content="https://braindexapp.com" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Braindex | The daily trivia game" />
  <meta name="twitter:description" content="Everyone gets the same questions each day. One attempt, then the leaderboard." />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K0GWY53ZN1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K0GWY53ZN1');
  </script>

  <style>
    :root{
      --primary:#EC1A6F;
      --primary-dark:#C2185B;
      --accent:#0E1A4A;
      --text:#1a1a2e;
      --text-muted:#5a5a73;
      --bg:#ffffff;
      --surface:#faf9fc;
      --border:#e8e6ee;
      --radius:16px;
      --font:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{
      font-family:var(--font);
      color:var(--text);
      background:var(--bg);
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      min-height:100vh;
      min-height:100dvh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header{
      padding:20px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1100px;
      width:100%;
      margin:0 auto;
    }
    .wordmark{
      display:flex;align-items:center;gap:9px;
      font-weight:700;font-size:19px;letter-spacing:-0.02em;
      color:var(--text);text-decoration:none;
    }
    .wordmark img{width:30px;height:30px}
    .nav-link{
      font-size:15px;font-weight:500;color:var(--text-muted);
      text-decoration:none;
    }
    .nav-link:hover{color:var(--primary)}

    /* ── Hero ───────────────────────────────────────────────── */
    main{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:32px 24px 56px;
      max-width:620px;
      margin:0 auto;
      width:100%;
    }
    .brain{
      width:148px;height:148px;
      object-fit:contain;
      margin-bottom:28px;
      animation:float 4s ease-in-out infinite;
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
    }
    @media (prefers-reduced-motion:reduce){
      .brain{animation:none}
    }

    h1{
      font-size:clamp(38px,9vw,60px);
      line-height:1.05;
      letter-spacing:-0.035em;
      font-weight:800;
      margin-bottom:18px;
    }
    h1 .pink{
      background:linear-gradient(135deg,var(--primary),#FF6FA5);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .sub{
      font-size:clamp(16px,4vw,19px);
      color:var(--text-muted);
      max-width:430px;
      margin-bottom:38px;
    }

    /* ── Store buttons ──────────────────────────────────────── */
    .stores{
      display:flex;gap:12px;flex-wrap:wrap;
      justify-content:center;margin-bottom:18px;
    }
    .store{
      display:flex;align-items:center;gap:10px;
      background:var(--accent);color:#fff;
      text-decoration:none;
      padding:11px 20px;border-radius:13px;
      transition:transform .15s ease,opacity .15s ease;
    }
    .store:hover{transform:translateY(-2px);opacity:.92}
    .store svg{width:23px;height:23px;flex-shrink:0;fill:#fff}
    .store-text{text-align:left;line-height:1.15}
    .store-text small{display:block;font-size:10px;opacity:.8;font-weight:500}
    .store-text strong{display:block;font-size:15px;font-weight:600;letter-spacing:-0.01em}

    /* ── Play now ───────────────────────────────────────────── */
    .play{
      display:inline-flex;align-items:center;gap:9px;
      background:var(--primary);color:#fff;
      font-size:17px;font-weight:700;letter-spacing:-0.01em;
      text-decoration:none;
      padding:15px 38px;border-radius:999px;
      box-shadow:0 5px 18px rgba(236,26,111,.3);
      transition:transform .15s ease,box-shadow .15s ease;
      margin-top:10px;
    }
    .play:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 24px rgba(236,26,111,.38);
    }
    .play-note{
      font-size:13.5px;color:var(--text-muted);
      margin-top:11px;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer{
      border-top:1px solid var(--border);
      padding:22px 24px;
      text-align:center;
      font-size:13.5px;color:var(--text-muted);
    }
    footer nav{
      display:flex;gap:20px;flex-wrap:wrap;
      justify-content:center;margin-bottom:9px;
    }
    footer a{color:var(--text-muted);text-decoration:none}
    footer a:hover{color:var(--primary)}
  </style>
</head>
<body>

  <header>
    <a class="wordmark" href="/">
      <img src="brain-character.png" alt="" />
      Braindex
    </a>
    <a class="nav-link" href="/about">About</a>
  </header>

  <main>
    <img class="brain" src="brain-character.png" alt="The Braindex brain character" />

    <h1>The daily<br><span class="pink">trivia game.</span></h1>

    <p class="sub">
      Everyone gets the same questions each day. One attempt,
      then see where you landed.
    </p>

    <div class="stores">
      <a class="store" href="https://apps.apple.com/us/app/braindex/id6766744989"
         onclick="gtag('event','store_click',{store:'ios'})">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 12.04c-.02-2.27 1.85-3.36 1.94-3.41-1.06-1.55-2.7-1.76-3.29-1.78-1.4-.14-2.73.82-3.44.82-.71 0-1.8-.8-2.96-.78-1.52.02-2.93.88-3.71 2.24-1.58 2.74-.4 6.8 1.13 9.02.75 1.09 1.65 2.31 2.82 2.27 1.13-.05 1.56-.73 2.93-.73s1.75.73 2.95.71c1.22-.02 1.99-1.11 2.74-2.2.86-1.26 1.22-2.48 1.24-2.55-.03-.01-2.37-.91-2.4-3.61zM14.8 5.37c.62-.76 1.04-1.8.93-2.85-.9.04-1.99.6-2.63 1.35-.57.67-1.07 1.74-.94 2.76 1 .08 2.02-.51 2.64-1.26z"/></svg>
        <span class="store-text">
          <small>Download on the</small>
          <strong>App Store</strong>
        </span>
      </a>

      <a class="store" href="https://play.google.com/store/apps/details?id=com.braindex.app"
         onclick="gtag('event','store_click',{store:'android'})">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.2c-.3.3-.5.8-.5 1.4v16.8c0 .6.2 1.1.5 1.4l.1.1 9.4-9.4v-.2L3.7 2.1l-.1.1zm12.6 6.3L13.9 11l2.3 2.3 2.8-1.6c.8-.5.8-1.3 0-1.8l-2.8-1.6v.2zm-2.9 2.9L4 20.7c.3.3.7.3 1.2 0l10.2-5.8-2.1-2.1v.6zM5.2 3.3c-.5-.3-.9-.3-1.2 0l9.3 9.3 2.1-2.1L5.2 3.3z"/></svg>
        <span class="store-text">
          <small>Get it on</small>
          <strong>Google Play</strong>
        </span>
      </a>
    </div>

    <a class="play" href="/app" onclick="gtag('event','play_web_click')">
      Play now
    </a>
    <p class="play-note">No download needed. Plays in your browser.</p>
  </main>

  <footer>
    <nav>
      <a href="/about">About</a>
      <a href="/support.html">Support</a>
      <a href="/privacy-policy.html">Privacy</a>
    </nav>
    &copy; 2026 Braindex
  </footer>

</body>
</html>
