<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master AI, one word at a time, in 2 minutes a day.">

  <!-- Open Graph / Twitter Card. These drive the share-sheet preview
       that iOS/Android render when someone shares a /play link. Without
       them, iOS falls back to the page title and the system would show
       "A new Flutter project." Keep title/description aligned with the
       in-app share text and the marketing site copy. -->
  <meta property="og:title" content="Braindex — Daily AI vocabulary game">
  <meta property="og:description" content="Master AI, one word at a time, in 2 minutes a day.">
  <meta property="og:image" content="https://braindexapp.com/og-image.png">
  <meta property="og:url" content="https://braindexapp.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Braindex">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Braindex — Daily AI vocabulary game">
  <meta name="twitter:description" content="Master AI, one word at a time, in 2 minutes a day.">
  <meta name="twitter:image" content="https://braindexapp.com/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Braindex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Braindex — Daily AI vocabulary game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
