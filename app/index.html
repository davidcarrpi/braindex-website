<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master AI, one word at a time, in 2 minutes a day.">

  <!-- Open Graph / Twitter Card. These drive the share-sheet preview
       that iOS/Android render when someone shares a /play link. Without
       them, iOS falls back to the page title and the system would show
       "A new Flutter project." Keep title/description aligned with the
       in-app share text and the marketing site copy. -->
  <meta property="og:title" content="Braindex — Daily AI vocabulary game">
  <meta property="og:description" content="Master AI, one word at a time, in 2 minutes a day.">
  <meta property="og:image" content="https://braindexapp.com/og-image.png">
  <meta property="og:url" content="https://braindexapp.com">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Braindex">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Braindex — Daily AI vocabulary game">
  <meta name="twitter:description" content="Master AI, one word at a time, in 2 minutes a day.">
  <meta name="twitter:image" content="https://braindexapp.com/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Braindex">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Braindex — Daily AI vocabulary game</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Boot splash.
    ============
    Flutter web ships ~18MB (engine + app + CanvasKit) before it can paint
    anything, and until it does the page is a blank white rectangle. On a
    slow connection that reads as "broken", which is the worst possible
    first impression for a visitor who has never seen the app.

    This is plain HTML/CSS with one 5KB icon, so it paints on the first
    frame the browser gets, long before Flutter has downloaded. It is
    removed when Flutter fires `flutter-first-frame`.

    Keep it dependency-free. Anything that needs to download defeats the
    point of having it.
  -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: linear-gradient(165deg, #FF3D8B 0%, #EC1A6F 42%, #C2185B 100%);
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }

    #boot .brain {
      width: 92px; height: 92px;
      animation: bounce 1.1s cubic-bezier(.3,.05,.3,1) infinite;
      transform-origin: center bottom;
    }
    /* Squash on landing, stretch on the way up, same feel as Brainy
       inside the app so the boot screen and the app agree. */
    @keyframes bounce {
      0%   { transform: translateY(0)     scale(1,1); }
      30%  { transform: translateY(-26px) scale(.94,1.06); }
      55%  { transform: translateY(0)     scale(1.08,.92); }
      75%  { transform: translateY(-6px)  scale(1,1); }
      100% { transform: translateY(0)     scale(1,1); }
    }

    #boot .shadow {
      width: 46px; height: 7px; margin-top: -20px;
      border-radius: 50%;
      background: rgba(0,0,0,.18);
      animation: shrink 1.1s cubic-bezier(.3,.05,.3,1) infinite;
    }
    @keyframes shrink {
      0%,100% { transform: scaleX(1);   opacity: .22; }
      30%     { transform: scaleX(.55); opacity: .10; }
    }

    #boot .word {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .02em;
      opacity: .9;
    }

    @media (prefers-reduced-motion: reduce) {
      #boot .brain, #boot .shadow { animation: none; }
    }
  </style>

  <div id="boot">
    <img class="brain" src="icons/Icon-192.png" alt="" />
    <div class="shadow"></div>
    <div class="word">Loading today's questions</div>
  </div>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var gone = false;
      function dismiss() {
        if (gone) return;
        gone = true;
        boot.classList.add('done');
        // Remove only after the fade, so it cannot swallow taps.
        setTimeout(function () { boot.remove(); }, 400);
      }
      // Flutter fires this once it has actually painted.
      window.addEventListener('flutter-first-frame', dismiss);
      // Safety net: never trap the user behind the splash if that event
      // does not arrive (older engine, a failed boot, an extension).
      setTimeout(dismiss, 20000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
